[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=3.0", "numpy"]
build-backend = "scikit_build_core.build"

[project]
name = "optics-simulator"
version = "0.1.0"
description = "Interactive parametric ray-tracing optics simulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "vispy",
    "PySide6",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
opticssim = "ui.app:main"

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
wheel.packages = ["optics", "rendering", "ui"]
sdist.include = ["native/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ARG", "RUF"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"benchmarks/*" = ["E402"]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["optics.*", "rendering.*", "ui.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
