name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libglx-mesa0 libxkbcommon-x11-0 \
            libdbus-1-3 libxcb-xinerama0 libxcb-cursor0

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Native C++ tests
        run: |
          pip install cmake
          cmake -S . -B build-native -DOPTICS_BUILD_MODULE=OFF -DOPTICS_BUILD_TESTS=ON
          cmake --build build-native --config Release --target optics_native_tests
          ctest --test-dir build-native -C Release --output-on-failure

      - name: Native C++ tests (sanitizers)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g" \
            -DOPTICS_BUILD_MODULE=OFF -DOPTICS_BUILD_TESTS=ON
          cmake --build build-sanitize --target optics_native_tests
          ctest --test-dir build-sanitize --output-on-failure

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy optics rendering ui tests

      - name: Run tests
        run: pytest
